name: Download Python Packages & Release

on:
  workflow_dispatch:
    inputs:
      split_size:
        description: '7z 分卷大小 (例如: 2g, 1024m, 500m)'
        required: true
        default: '2g'
      release_tag:
        description: 'Release 标签名称'
        required: true
        default: 'v1.0.0-packages'
        
permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full

    - name: Create Download Directory
      run: mkdir -p python_packages

    - name: Execute Pip Download
      run: |
        cd python_packages
        echo "=== 开始下载除 PyTorch 外的其他所有依赖包 ==="
        pip3 download ultralytics pandas pip label-studio Flask numpy opencv-python scipy loguru PIL secsgem vncdotool scikit-learn matplotlib --index-url https://pypi.org

    - name: Generate requirements.txt from downloaded files
      run: |
        python -c '
        import os
        
        pkg_dir = "python_packages"
        req_file = os.path.join(pkg_dir, "requirements.txt")
        requirements = []
        
        if os.path.exists(pkg_dir):
            for file in os.listdir(pkg_dir):
                # 1. 处理 Wheel 包 (.whl)
                if file.endswith(".whl"):
                    parts = file.split("-")
                    if len(parts) >= 2:
                        name = parts[0].replace("_", "-")
                        version = parts[1]
                        requirements.append(f"{name}=={version}")

                # 2. 处理源码包 (.tar.gz 或 .zip)
                elif file.endswith(".tar.gz") or file.endswith(".zip"):
                    ext = ".tar.gz" if file.endswith(".tar.gz") else ".zip"
                    base_name = file[:-len(ext)]
                    if "-" in base_name:
                        name, version = base_name.rsplit("-", 1)
                        name = name.replace("_", "-")
                        requirements.append(f"{name}=={version}")
            
            # 去重并排序
            requirements = sorted(list(set(requirements)))
            
            # 写入清单
            with open(req_file, "w", encoding="utf-8") as f:
                for req in requirements:
                    f.write(req + "\n")
            print(f"成功生成清单，共计包含 {len(requirements)} 个依赖项。")
        else:
            print("错误：未找到下载目录！")
        '

    - name: Compress into 7z split volumes
      run: |
        7z a -v${{ github.event.inputs.split_size }} packages_archive.7z ./python_packages/*

    - name: Create GitHub Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag }}
        name: "Python Packages (${{ github.event.inputs.release_tag }})"
        body: |
          Automated download of Python ML/DL packages (excluding PyTorch).
          Target Environment: Ubuntu 24.04 & Python 3.12.

        files: |
          packages_archive.7z.*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
